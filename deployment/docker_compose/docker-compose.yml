# Lexifin Database Stack Configuration
version: '3.8'

services:
  # 1. Qdrant: Vector Database for Dense Embeddings
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexifin_qdrant
    ports:
      - "6333:6333" # REST API
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - lexifin_network

  # 2. Neo4j: Graph Database for Entity Relationships
  neo4j:
    image: neo4j:5
    container_name: lexifin_neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/LexiFinGraph2026
      # Install APOC (Awesome Procedures on Cypher) plugin for advanced graph algorithms
      - NEO4JLABS_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - ./neo4j_data:/data
    restart: unless-stopped
    networks:
      - lexifin_network

networks:
  lexifin_network:
    driver: bridge