# LLM profiles for src/llm: [<kind>.<name>], kind = chat | embedding | rerank,
# name = a role. Code asks for the role, so a model swap is an edit here.
# URLs and keys live only in .env:
#   openai / anthropic / gemini   -> OPENAI_ / ANTHROPIC_ / GEMINI_API_KEY
#   openai_compat / http_rerank   -> <KIND>_<NAME>_BASE_URL, _API_KEY
# `model` is the id results are stored under; `served_model` is the name sent
# to the server when it differs. `options` is merged into every request body.

[defaults]
timeout_s = 120
max_retries = 3


# ---------------------------------------------------------------- chat ----

# Spare model. Google AI Studio free tier (5 req/min, 20 req/day).
[chat.default]
provider = "gemini"
model = "gemini-3.6-flash"
max_tokens = 16000

# Writes RAG answers. Cerebras (Groq: drop served_model).
[chat.generator]
provider = "openai_compat"
model = "openai/gpt-oss-120b"
served_model = "gpt-oss-120b"
max_tokens = 8192
temperature = 0.0
timeout_s = 300

# Reads a question before retrieval (language, translation, companies,
# filters). Same Cerebras model, own key (quota per key).
[chat.query]
provider = "openai_compat"
model = "openai/gpt-oss-120b"
served_model = "gpt-oss-120b"
max_tokens = 4096
temperature = 0.0
effort = "low"
timeout_s = 60

# Grades answers. Must be another model family than the generator.
# NVIDIA API catalog free tier (40 req/min).
[chat.judge]
provider = "openai_compat"
model = "mistralai/mistral-large-4-1t-a52b"
max_tokens = 8192
temperature = 0.0
timeout_s = 300


# ----------------------------------------------------------- embedding ----

# vLLM on Kaggle (2x T4). Same model the chunks were token-capped with.
[embedding.default]
provider = "openai_compat"
model = "Qwen/Qwen3-Embedding-0.6B"
batch_size = 64
query_instruction = "Given a question about SEC filings, retrieve passages that answer it"


# -------------------------------------------------------------- rerank ----

# vLLM /rerank. prompt_format "qwen3": without its chat template
# Qwen3-Reranker scores almost at random.
[rerank.default]
provider = "http_rerank"
model = "Qwen/Qwen3-Reranker-0.6B"
prompt_format = "qwen3"
instruction = "Given a question about SEC filings, judge whether the passage helps answer it"
