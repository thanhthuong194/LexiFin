[project]
name = "lexifin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.44.1",
    "python-dotenv>=1.1.1",
    "pytest>=9.1.1",
    "sec-edgar-downloader>=5.1.0",
    "structlog>=26.1.0",
    "vnstock>=4.0.7",
    "vnai>=2.6.0",
    "pyiceberg>=0.12.0",
    "pyarrow>=25.0.1",
    "duckdb>=1.5.6",
    "sqlalchemy>=2.1.3",
]

[tool.pytest]
minversion = "9.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing"
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Fast isolated unit tests",
    "integration: Integration tests requiring local I/O or network",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "vulture>=2.16",
]

[[tool.uv.index]]
name = "vnstock"
url = "https://vnstocks.com/api/simple"
explicit = true

[tool.uv.sources]
vnai = { index = "vnstock" }
vnstock = { index = "vnstock" }

[tool.ruff.lint]
extend-select = [
  "B",      # likely bugs
  "UP",     # outdated syntax
  "SIM",    # needlessly complex code
  "RET",    # redundant return patterns
  "ARG",    # unused arguments
  "C90",    # cyclomatic complexity
  "PL",     # too many arguments, branches, statements, returns
  "FBT",    # boolean mode parameters
  "ERA",    # commented-out code
  "T20",    # print statements
  "BLE",    # blind `except Exception`
  "S110",   # try / except / pass
  "PGH",    # blanket `type: ignore` and `noqa`
  "RUF100", # unused `noqa`
]
ignore = [
  "PLR2004", # magic values in comparisons: too noisy
  "PLC0415", # imports inside functions: legitimate for heavy optional libraries
  "FBT003",  # boolean literals in calls: too noisy
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "FBT", "PLR0913"]
"scripts/**" = ["T20"]
"vulture_whitelist.py" = ["F821", "B018"]  # generated list of bare names

[tool.mypy]
strict = true

[tool.vulture]
min_confidence = 60
ignore_decorators = ["@app.*", "@router.*", "@pytest.fixture"]
