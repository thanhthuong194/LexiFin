[project]
name = "lexifin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.44.1",
    "python-dotenv>=1.1.1",
    "pytest>=9.1.1",
    "sec-edgar-downloader>=5.1.0",
    "structlog>=26.1.0",
    "vnstock>=4.0.7",
    "vnai>=2.6.0",
    "pyiceberg>=0.12.0",
    "pyarrow>=25.0.1",
    "duckdb>=1.5.6",
    "sqlalchemy>=2.1.3",
]

[tool.pytest]
minversion = "9.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing"
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Fast isolated unit tests",
    "integration: Integration tests requiring local I/O or network",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[[tool.uv.index]]
name = "vnstock"
url = "https://vnstocks.com/api/simple"
explicit = true

[tool.uv.sources]
vnai = { index = "vnstock" }
vnstock = { index = "vnstock" }
